name: Track herdr

# Opens a pull request when herdr publishes a release newer than the one the
# schema snapshot was taken from. The release binary is downloaded from the
# upstream repository, so the upgrade reflects that release and not whatever
# herdr happens to be installed on a maintainer's machine.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'herdr release tag to upgrade to, e.g. v0.9.0 (default: the latest release)'
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      current: ${{ steps.resolve.outputs.current }}
      branch: ${{ steps.resolve.outputs.branch }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # `gh release view` with no tag resolves the latest release excluding
          # prereleases, which is what keeps the schedule off the preview builds
          # upstream publishes between versions.
          if [ -n "$REQUESTED" ]; then
            tag="$REQUESTED"
          else
            tag="$(gh release view --repo herdrdev/herdr --json tagName --jq .tagName)"
          fi
          current="$(jq -r .herdr_version schema/method-results.json)"
          branch="herdr-${tag#v}"
          {
            echo "tag=$tag"
            echo "current=$current"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          if [ "${tag#v}" = "$current" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "The snapshot is already taken from herdr $current." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Branch \`$branch\` already exists, so $tag has been prepared already." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "$tag is newer than the snapshot's herdr $current." >> "$GITHUB_STEP_SUMMARY"
          fi

  upgrade:
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # GitHub does not trigger workflows for events GITHUB_TOKEN produced, so
    # no check run appears on the pull request this job opens. Everything `just
    # check` covers therefore runs here, and the run that opened the pull
    # request is what its body points at.
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      CURRENT: ${{ needs.check.outputs.current }}
      BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the herdr release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          gh release download "$TAG" --repo herdrdev/herdr \
            --pattern herdr-linux-x86_64 --output "$RUNNER_TEMP/bin/herdr"
          chmod +x "$RUNNER_TEMP/bin/herdr"
          # The asset name carries no version, so confirm the binary is the
          # release that was asked for before generating anything from it.
          target="${TAG#v}"
          got="$("$RUNNER_TEMP/bin/herdr" --version)"
          if [ "$got" != "herdr $target" ]; then
            echo "$TAG downloaded a binary reporting \"$got\"" >&2
            exit 1
          fi
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Refresh the schema snapshot
        run: |
          set -euo pipefail
          herdr api schema --output schema/herdr-api.schema.json
          # An unchanged schema cannot change the generated code, which leaves
          # the recorded version as the whole of the diff.
          if git diff --quiet -- schema/herdr-api.schema.json; then
            echo "SCHEMA_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "SCHEMA_CHANGED=true" >> "$GITHUB_ENV"
          fi
          protocol="$(jq -r .protocol schema/herdr-api.schema.json)"
          schema_version="$(jq -r .schema_version schema/herdr-api.schema.json)"
          tmp="$(mktemp)"
          jq --arg v "$TARGET" --argjson p "$protocol" \
            '.herdr_version = $v | .protocol = $p' schema/method-results.json > "$tmp"
          mv "$tmp" schema/method-results.json
          {
            echo "PROTOCOL=$protocol"
            echo "SCHEMA_VERSION=$schema_version"
          } >> "$GITHUB_ENV"

      - name: Record the snapshot version in the docs
        run: |
          set -euo pipefail
          sed -i "s/generated against herdr [0-9][0-9A-Za-z.+-]*,/generated against herdr $TARGET,/" README.md
          sed -i "s/^protocol [0-9]*:/protocol $PROTOCOL:/" README.md
          sed -i "s/^| herdr version | .* |$/| herdr version | $TARGET |/" schema/README.md
          sed -i "s/^| \`protocol\` | .* |$/| \`protocol\` | $PROTOCOL |/" schema/README.md
          sed -i "s/^| \`schema_version\` | .* |$/| \`schema_version\` | $SCHEMA_VERSION |/" schema/README.md

      # The generator refuses to run while a method in the schema has no entry
      # in method-results.json, so a release that adds one would stop the
      # regeneration and leave the branch without generated code for anything.
      # The schema states that a method exists and that a result type exists
      # but never that one answers the other; only herdr's handlers do, which
      # is what herdrsource reads. A method it settles gets that result type,
      # one it cannot gets an entry accepting any result, and either way the
      # regeneration proceeds.
      - name: Fetch the herdr sources for the release
        run: |
          set -euo pipefail
          # Only src/ is read, and the scan needs file contents rather than
          # history, so the clone takes one commit and no blobs it will not open.
          git clone --quiet --depth 1 --branch "$TAG" --filter=blob:none \
            --no-checkout https://github.com/herdrdev/herdr.git "$RUNNER_TEMP/herdr-src"
          git -C "$RUNNER_TEMP/herdr-src" sparse-checkout set --no-cone 'src/**'
          git -C "$RUNNER_TEMP/herdr-src" checkout --quiet

      - name: Read the result type of each method from the handlers
        id: methods
        continue-on-error: true
        run: |
          set -o pipefail
          go run ./internal/cmd/herdrsource \
            -src "$RUNNER_TEMP/herdr-src" \
            -apply \
            -report "$RUNNER_TEMP/methods.md"
          echo "read the table against the $TAG handlers"

      - name: Regenerate the API surface
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          go generate ./... 2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: Build and test
        id: test
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          go build ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
          go test -race ./... 2>&1 | tee -a "$RUNNER_TEMP/test.log"

      - name: Lint
        id: lint
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13

      - name: Type-check the other platforms
        id: cross
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          for goos in linux darwin windows; do
            GOOS="$goos" go vet ./... 2>&1 | tee -a "$RUNNER_TEMP/cross.log"
          done

      - name: Compare a running server against the refreshed snapshot
        id: herdrcheck
        continue-on-error: true
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/herdr-config
          HERDR_SOCKET_PATH: ${{ runner.temp }}/herdr.sock
        run: |
          set -o pipefail
          mkdir -p "$XDG_CONFIG_HOME"
          # The step does not finish while a background process still holds its
          # stdout, so the server's output goes to a file.
          herdr server >"$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 15); do
            if herdr status server 2>/dev/null | grep -q 'status: running'; then
              break
            fi
            sleep 1
          done
          # herdrcheck only notes an unreachable server, so the run has to fail
          # here rather than report "no drift" for a comparison never made.
          herdr status server | grep -q 'status: running'
          go run ./internal/cmd/herdrcheck 2>&1 | tee "$RUNNER_TEMP/herdrcheck.log"

      - name: Stop the server
        if: always()
        continue-on-error: true
        env:
          HERDR_SOCKET_PATH: ${{ runner.temp }}/herdr.sock
        run: herdr server stop

      # known-gaps.json records the version its entries were last confirmed
      # against, so it moves only when herdrcheck found every gap still open
      # and nothing beyond them.
      - name: Record the gap list as confirmed against the release
        if: steps.herdrcheck.outcome == 'success'
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          jq --arg v "$TARGET" '.herdr_version = $v' schema/known-gaps.json > "$tmp"
          mv "$tmp" schema/known-gaps.json

      - name: Run the e2e suite against the release
        id: e2e
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          go test -tags e2e -count=1 -v ./internal/e2e/... 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Compose the pull request body
        env:
          METHODS: ${{ steps.methods.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          TEST: ${{ steps.test.outcome }}
          LINT: ${{ steps.lint.outcome }}
          CROSS: ${{ steps.cross.outcome }}
          HERDRCHECK: ${{ steps.herdrcheck.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pr-body.md"

          if [ "$METHODS" = success ] && [ "$GENERATE" = success ] \
            && [ "$TEST" = success ] && [ "$LINT" = success ] \
            && [ "$CROSS" = success ] && [ "$HERDRCHECK" = success ] \
            && [ "$E2E" = success ]; then
            all_passed=true
          else
            all_passed=false
          fi
          echo "ALL_PASSED=$all_passed" >> "$GITHUB_ENV"

          outcome() {
            case "$1" in
              success) echo "passed" ;;
              failure) echo "**failed**" ;;
              *) echo "skipped" ;;
            esac
          }

          log_section() {
            local title="$1" file="$2"
            [ -s "$file" ] || return 0
            {
              echo "<details><summary>$title</summary>"
              echo
              echo '```'
              tail -c 8000 "$file"
              echo '```'
              echo
              echo "</details>"
              echo
            } >> "$body"
          }

          {
            echo "herdr $TARGET is out; the snapshot was taken from $CURRENT."
            echo "The schema below came from the \`herdr-linux-x86_64\` asset of \`$TAG\`."
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| \`herdrsource\` against the $TAG handlers | $(outcome "$METHODS") |"
            echo "| \`go generate ./...\` | $(outcome "$GENERATE") |"
            echo "| \`go build\` and \`go test -race\` | $(outcome "$TEST") |"
            echo "| \`golangci-lint\` | $(outcome "$LINT") |"
            echo "| \`go vet\` for linux, darwin and windows | $(outcome "$CROSS") |"
            echo "| \`herdrcheck\` against a $TARGET server | $(outcome "$HERDRCHECK") |"
            echo "| \`internal/e2e\` against a $TARGET server | $(outcome "$E2E") |"
            echo
            echo "GitHub does not run workflows for events its own token produced. The CI"
            echo "run on this pull request was created but never executed, so its red mark"
            echo "reports nothing; the results above come from [the run that opened this pull"
            echo "request]($RUN_URL). A commit pushed to the branch by hand starts CI on it."
            echo
            if [ "$all_passed" = true ] && [ "$SCHEMA_CHANGED" = false ]; then
              echo "The release left the schema byte for byte what it was, so the recorded"
              echo "version is the whole of this diff and the workflow merges it. Behaviour"
              echo "the schema does not describe can still have moved: the upgrade checklist"
              echo "in \`docs/design.md\` lists those facts with the herdr source file each came"
              echo "from, and nothing here regenerates them."
            else
              echo "Before merging:"
              echo
              if [ "$METHODS" != success ]; then
                echo "- [ ] Settle what \`herdrsource\` left open below: narrow any entry it could not read, and check the ones it flags."
              fi
              echo "- [ ] Call each method the release added in \`internal/e2e\`, or record in \`outOfReach\` why the suite cannot."
              echo "- [ ] Re-derive that table from the herdr v$TARGET handler sources and update its \`_comment\`, which still names the version it was read from."
              echo "- [ ] Walk the upgrade checklist in \`docs/design.md\`: it lists the behaviour the schema does not describe, along with the herdr source file each fact came from."
              echo "- [ ] Update the method and e2e coverage counts in \`README.md\` and \`schema/README.md\` if they moved."
            fi
            echo
          } > "$body"

          if [ -s "$RUNNER_TEMP/methods.md" ]; then
            {
              echo "## The result type of each method"
              echo
              echo "Read out of the \`$TAG\` handlers, which is where the relation lives:"
              echo "the schema names every method and every result but never says which"
              echo "answers which."
              echo
              cat "$RUNNER_TEMP/methods.md"
            } >> "$body"
          fi

          log_section "go generate" "$RUNNER_TEMP/generate.log"
          log_section "go build and go test" "$RUNNER_TEMP/test.log"
          log_section "go vet for the other platforms" "$RUNNER_TEMP/cross.log"
          log_section "herdrcheck" "$RUNNER_TEMP/herdrcheck.log"
          log_section "e2e" "$RUNNER_TEMP/e2e.log"

          cat "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE: ${{ steps.generate.outcome }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A schema README.md herdr

          if [ "$GENERATE" = success ]; then
            message="Regenerate the client against herdr $TARGET"
          else
            message="Refresh the schema snapshot for herdr $TARGET"
          fi
          git commit -m "$message"
          git push origin "$BRANCH"

          draft=()
          if [ "$ALL_PASSED" != true ]; then
            draft=(--draft)
          fi
          gh pr create "${draft[@]}" \
            --head "$BRANCH" \
            --title "$message" \
            --body-file "$RUNNER_TEMP/pr-body.md"

          # A release that leaves the schema alone moves nothing but the
          # recorded version, so there is no diff for a reviewer to read. The
          # branch holds one commit on the tip of the default branch, which is
          # why rebasing it keeps that commit and its message as written.
          if [ "$ALL_PASSED" = true ] && [ "$SCHEMA_CHANGED" = false ]; then
            # GitHub computes mergeability after the pull request exists, so a
            # merge sent straight away can be refused for a state it has not
            # worked out yet.
            merged=false
            for _ in 1 2 3 4 5; do
              if gh pr merge "$BRANCH" --rebase; then
                merged=true
                break
              fi
              sleep 5
            done
            if [ "$merged" != true ]; then
              echo "the pull request is open and was not merged" >&2
              exit 1
            fi
            git push origin --delete "$BRANCH"
          fi
